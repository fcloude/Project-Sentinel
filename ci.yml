name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests only need these, not the heavy AI packages.
      - run: pip install pytest ruff opencv-python-headless numpy python-dotenv
      - run: ruff check .
      - run: pytest -q
