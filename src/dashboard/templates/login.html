<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Project Sentinel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<main class="auth-card">
    <h1>🛡️ Project Sentinel</h1>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" maxlength="64" required autocomplete="username" autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password">
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
