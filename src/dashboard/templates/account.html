<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Project Sentinel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<main class="auth-card">
    <h1>Change password</h1>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    {% if message %}<p class="auth-ok" role="status">{{ message }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" required autocomplete="current-password">
        <label for="new_password">New password (min 10 characters)</label>
        <input id="new_password" name="new_password" type="password" minlength="10" maxlength="128" required autocomplete="new-password">
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" minlength="10" maxlength="128" required autocomplete="new-password">
        <button type="submit">Change password</button>
    </form>
    <p><a href="{{ url_for('index') }}">Back to dashboard</a></p>
</main>
</body>
</html>
