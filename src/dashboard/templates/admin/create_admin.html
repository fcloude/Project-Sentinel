{% extends "admin/base.html" %}
{% block title %}Create User{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h3>New User Account</h3>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Username (3-32 characters)</label>
      <input type="text" name="username" minlength="3" maxlength="32" required autofocus>
    </div>
    <div class="form-group">
      <label>Password (min 10 characters)</label>
      <input type="password" name="password" minlength="10" maxlength="128" required>
    </div>
    <div class="form-group">
      <label>Role</label>
      <select name="role">
        <option value="viewer">Viewer — read-only access</option>
        <option value="admin" selected>Admin — full access</option>
      </select>
    </div>
    <div class="actions-row">
      <button type="submit" class="btn btn-primary">Create Account</button>
      <a href="{{ url_for('admin.admin_users') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
