<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-run setup - Project Sentinel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<main class="auth-card">
    <h1>🛡️ Create the admin account</h1>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.setup') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if needs_token %}
        <label for="setup_token">Setup token</label>
        <input id="setup_token" name="setup_token" type="password" required autocomplete="off">
        {% endif %}
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="32" required autocomplete="username">
        <label for="password">Password (min 10 characters)</label>
        <input id="password" name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" minlength="10" maxlength="128" required autocomplete="new-password">
        <button type="submit">Create admin</button>
    </form>
</main>
</body>
</html>
