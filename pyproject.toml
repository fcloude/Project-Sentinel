[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Local-first AI camera monitor"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "opencv-python",
    "numpy",
    "flask",
    # Production WSGI server used by run.py (it falls back to Flask's dev server without it).
    "waitress",
    # Preferred password hasher in src/security/passwords.py (scrypt is the fallback).
    "argon2-cffi",
    "requests",
    "python-telegram-bot",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Only real errors for now (syntax errors, undefined names). Widen later.
select = ["E9", "F63", "F7", "F82"]
